name: Update trend volume data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These map to China trading hours while avoiding
    # common :00/:15/:30/:45 schedule congestion.
    - cron: "38,53 1 * * 1-5"       # 09:38 / 09:53 CST
    - cron: "8,23,38,53 2-6 * * 1-5" # 10:08-14:53 CST
    - cron: "8,23,38,53 7 * * 1-5"   # 15:08-15:53 CST
    - cron: "10 8 * * 1-5"           # 16:10 CST final snapshot

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-volume-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build 931643 constituent aggregate volume
        working-directory: v2/trend
        run: python scripts/build_index_volume.py --allow-stale-on-failure

      - name: Build 000688 constituent aggregate volume
        working-directory: v2/trend
        run: |
          python scripts/build_index_volume.py \
            --constituents data/index_constituents/000688.json \
            --output data/generated/index-volume-000688.json \
            --js-output data/generated/index-volume-000688.js \
            --allow-stale-on-failure

      - name: Commit generated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/trend/data/generated/index-volume-931643.json v2/trend/data/generated/index-volume-931643.js
          git add v2/trend/data/generated/index-volume-000688.json v2/trend/data/generated/index-volume-000688.js
          git diff --cached --quiet || git commit -m "Update trend volume data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Add .nojekyll marker
        run: touch v2/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./v2
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
